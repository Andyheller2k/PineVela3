<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your PineVela password recovery code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#001d3d;font-family:Arial,Helvetica,sans-serif;color:#001d3d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#001d3d">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8fafc" style="max-width:480px;border:1px solid #ffc300;border-radius:20px;">
            <tr>
              <td align="center" style="padding:28px 24px 12px;">
                <img src="https://bivajljcdeofyxzmplxm.supabase.co/storage/v1/object/public/branding/pinevela-logo.png" width="84" height="90" alt="PineVela" style="display:block;border:0;width:84px;height:90px;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 24px 0;">
                <h1 style="margin:0;font-size:24px;line-height:1.4;color:#001d3d;">Reset your PineVela password</h1>
                <p style="margin:14px 0 0;font-size:16px;line-height:1.6;">Enter this recovery code in PineVela, then choose and confirm your new password:</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffd60a" style="border-radius:12px;">
                  <tr>
                    <td align="center" style="padding:20px 12px;font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:700;letter-spacing:6px;line-height:1.5;color:#001d3d;">{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 28px;text-align:center;">
                <p style="margin:0;font-size:13px;line-height:1.7;color:#4b5b70;">Use this code only in PineVela and never share it. If you didn&rsquo;t request a password reset, you can ignore this email. Your password stays unchanged.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
