<!doctype html>
<html lang="en" data-app-mode="installed" data-native-preview="false">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://nominatim.openstreetmap.org https://valhalla1.openstreetmap.de; frame-src https://pinevela.app/api/auth/mobile/captcha https://challenges.cloudflare.com about:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <title>PineVela</title>
    <link rel="icon" href="/icons/pinevela-192.png" type="image/png" />
    <style>
      :root { --pv-chrome-color: #ffffff; color-scheme: light; background: #ffffff; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --pv-chrome-color: #001d3d; color-scheme: dark; background: #001d3d; } }
      body { margin: 0; background: var(--pv-chrome-color); }
      #pv-app-launch { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--pv-chrome-color); color: #ffd60a; font-family: system-ui, sans-serif; }
      .pv-app-launch-icon { width: 60px; height: 60px; background: transparent; }
      .pv-app-launch-name { display: flex; font-size: 18px; font-weight: 800; letter-spacing: -.04em; line-height: 1.2; }
      .pv-app-launch-track { width: 64px; height: 3px; overflow: hidden; border-radius: 99px; background: #826f3540; }
      .pv-app-launch-track::after { content: ''; display: block; width: 50%; height: 100%; background: #d6a700; border-radius: inherit; animation: pv-app-opening 1.15s ease-in-out infinite alternate; }
      .pv-app-launch-recovery { max-width: 280px; color: #b4c6d9; text-align: center; font-size: 14px; line-height: 1.5; }
      html[data-theme="light"] .pv-app-launch-recovery { color: #3d526c; }
      .pv-app-launch-recovery button { min-height: 44px; margin-top: 12px; border: 0; border-radius: 12px; padding: 10px 20px; background: #ffd60a; color: #001d3d; font: inherit; font-weight: 700; cursor: pointer; }
      .pv-app-launch-recovery button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
      @keyframes pv-app-opening { from { transform: translateX(0); } to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .pv-app-launch-track::after { animation: none; transform: translateX(50%); } }
    </style>
  </head>
  <body>
    <div id="pv-app-launch" role="status" aria-label="Opening PineVela">
      <img class="pv-app-launch-icon" src="/store-covers/pinevela-logo.svg" alt="" width="60" height="60" />
      <div class="pv-app-launch-name pinevela-wordmark" aria-hidden="true"><span class="pine-label">Pine</span><span class="vela-label">Vela</span></div>
      <span class="pv-app-launch-track" aria-hidden="true"></span>
      <div class="pv-app-launch-recovery" hidden><p>Taking longer than usual. Check your connection.</p><button type="button">Reload app</button></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/native/main.tsx"></script>
  </body>
</html>
