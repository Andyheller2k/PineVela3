apply plugin: 'com.android.application'

android {
    namespace = "app.pinevela.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.pinevela.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-step3-debug"
            resValue "string", "app_name", "PineVela Development"
            resValue "string", "title_activity_main", "PineVela Development"
            manifestPlaceholders = [authScheme: "pinevela-debug"]
            buildConfigField "String", "API_ORIGIN", '"https://pinevela.app"'
        }
        release {
            manifestPlaceholders = [authScheme: "pinevela"]
            buildConfigField "String", "API_ORIGIN", '"https://pinevela.app"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Isolated emulator fixture: its CA is trusted only by this build variant.
        // Neither the test origin nor the test trust anchor enters debug/release.
        transportTest {
            initWith debug
            applicationIdSuffix ".transporttest"
            matchingFallbacks = ['debug']
            versionNameSuffix "-transport-test"
            buildConfigField "String", "API_ORIGIN", '"https://10.0.2.2:9443"'
        }
    }
    buildFeatures { buildConfig true }
    testBuildType "transportTest"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Native Google chooser; ID tokens stay inside the private transport plugin.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    // Independent cookie handling: Capacitor's process-global CookieHandler is never used.
    // 5.5.x requires compileSdk37; Capacitor8 currently uses36. The exact
    // 5.5.1 compromised-CA SPKI guard is applied before HTTP transmission below.
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def firebaseConfigs = ['google-services.json', 'src/debug/google-services.json', 'src/release/google-services.json']
if (firebaseConfigs.any { file(it).isFile() && file(it).length() > 0 }) {
    apply plugin: 'com.google.gms.google-services'
    // The offline, isolated transport fixture never contacts Firebase. No fake
    // project registration or real sender credential enters that test variant.
    tasks.matching { it.name == 'processTransportTestGoogleServices' }.configureEach { enabled = false }
} else {
    logger.info('Firebase client configuration missing; Android push remains unavailable.')
}
